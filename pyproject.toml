[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "directional-irreversibility-index"
version = "0.1.0"
description = "Directional residual-dependence diagnostics for nonlinear relationships"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Arka Prava Bandyopadhyay"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]
keywords = ["dependence", "HSIC", "time-series", "econometrics", "machine-learning"]

[tool.setuptools.packages.find]
include = ["directional_irreversibility*"]
